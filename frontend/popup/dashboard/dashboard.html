<!DOCTYPE html>

<html>

<head>

    <title>PrivacyGuard Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

</head>

<body>

    <div class="container">

        <!-- Header -->

        <div class="header">

            <div>

                <h1>🛡️ PrivacyGuard</h1>

                <p>Privacy Dashboard</p>

            </div>

            <div
                class="website"
                id="websiteName"
            >
                Loading...
            </div>

        </div>


        <!-- Website Score -->

        <div class="score-card">

            <p class="score-title">

                Website Privacy Score

            </p>

            <div class="score">

                <span
                    id="websiteScore"
                >
                    0
                </span>

                <span>
                    /100
                </span>

            </div>

            <p
                class="score-status"
                id="scoreStatus"
            >
                Loading...
            </p>

        </div>


        <!-- Statistics -->

        <div class="stats">

            <div class="stat-box">

                <div
                    class="stat-number"
                    id="totalCookies"
                >
                    0
                </div>

                <div class="stat-label">

                    Total Cookies

                </div>

            </div>


            <div class="stat-box">

                <div
                    class="stat-number"
                    id="blockedCookies"
                >
                    0
                </div>

                <div class="stat-label">

                    Blocked

                </div>

            </div>


            <div class="stat-box">

                <div
                    class="stat-number"
                    id="allowedCookies"
                >
                    0
                </div>

                <div class="stat-label">

                    Allowed

                </div>

            </div>

        </div>


        <!-- Cookie Section -->

        <div class="section-header">

            <h2>

                Cookie Details

            </h2>

            <span
                id="cookieCount"
            >
                0 detected
            </span>

        </div>


        <!-- Filters -->

        <div class="filters">

            <button
                id="allButton"
                class="filter active"
            >
                All
            </button>


            <button
                id="blockedButton"
                class="filter"
            >
                Blocked
            </button>


            <button
                id="allowedButton"
                class="filter"
            >
                Allowed
            </button>

        </div>


        <!-- Cookie Cards -->

        <div
            id="cookieContainer"
        >
        </div>

    </div>


    <script src="dashboard.js"></script>

</body>

</html>
